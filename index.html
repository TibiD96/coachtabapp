<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoachTab</title>
<meta name="description" content="CoachTab connects personal trainers and their clients: plan workouts, log sets, see results.">
<style>
  :root { --bg:#ffffff; --fg:#1c1c1a; --muted:#5e5e58; --line:#e2e2dc; --accent:#4f6b00; --mark:#d4ff3f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121212; --fg:#f2f2ed; --muted:#a3a39c; --line:#2c2c29; --accent:#d4ff3f; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  main { max-width:640px; margin:0 auto; padding:56px 16px; }
  .brand { display:inline-block; font-weight:800; background:var(--mark); color:#121212; padding:2px 10px; border-radius:6px; font-size:14px; }
  h1 { font-size:32px; line-height:1.2; margin:16px 0 8px; }
  p { color:var(--muted); }
  ul { padding-left:22px; } li { margin:6px 0; }
  a { color:var(--accent); }
  footer { margin-top:48px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<main>
  <span class="brand">CoachTab</span>
  <h1>Your trainer's plan, in your pocket.</h1>
  <p>CoachTab connects personal trainers and their clients. Trainers plan workouts day by day; clients log their reps and weights; trainers see the results right away.</p>
  <ul>
    <li><a href="privacy.html">Privacy Policy</a></li>
    <li><a href="delete-account.html">Delete your account</a></li>
  </ul>
  <footer>Contact: <a href="mailto:coachtabsupport@gmail.com">coachtabsupport@gmail.com</a></footer>
</main>
</body>
</html>
